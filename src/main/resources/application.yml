server:
  port: 8082

spring:
  application:
    name: pulsewatch-core
  threads:
    virtual:
      enabled: true # Activates Java 21 Virtual Threads for all Web & Async executions

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulsewatch_db}
    username: ${SPRING_DATASOURCE_USERNAME:pulsewatch}
    password: ${SPRING_DATASOURCE_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate # Flyway executes migrations; Hibernate validates schema integrity
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Must stay comfortably above the 10s blocking BRPOP so the client never
      # kills a legitimate wait (see the earlier "Redis command timed out" race).
      timeout: 20000ms