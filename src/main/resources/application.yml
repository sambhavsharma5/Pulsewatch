server:
  port: 8082

spring:
  application:
    name: pulsewatch-core
  threads:
    virtual:
      enabled: true # Activates Java 21 Virtual Threads for all Web & Async executions

  datasource:
    url: jdbc:postgresql://localhost:5432/pulsewatch_db
    username: pulsewatch
    password: secretpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate # Flyway executes migrations; Hibernate validates schema integrity
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 10000ms